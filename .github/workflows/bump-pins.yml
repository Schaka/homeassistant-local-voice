name: Bump pins

# Every Monday, and on demand: if any pinned native component has a newer
# upstream version (scripts/bump-pins.sh), this workflow opens one pull request
# that bumps all of them together. The components share one image, so the
# combination is what gets tested. The workflow starts CI on the branch and
# test-builds the image without a push. A person reads the release notes
# (skill bump-native-engine) and merges. The merge builds and publishes the
# image as for any other change.
#
# The repository setting "Allow GitHub Actions to create and approve pull
# requests" (Settings > Actions > General) must be on.

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Start CI on the branch, and read the registry build cache.
  actions: write
  packages: read

concurrency:
  group: bump-pins
  cancel-in-progress: false

env:
  BRANCH: bump/pins

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update the pins
        id: bump
        run: |
          set -euo pipefail
          ./scripts/bump-pins.sh | tee summary.txt
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the branch and open the pull request
        if: steps.bump.outputs.changed == 'true'
        env:
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          changes="$(grep -- ' -> ' summary.txt)"
          names="$(echo "$changes" | cut -d: -f1 | paste -sd, - | sed 's/,/, /g')"
          title="Bump pins: $names"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -q -am "$title" -m "$changes"
          # The branch is built again from the default branch at each run.
          git push --force origin "$BRANCH"
          body="$(printf 'Automatic bump from `scripts/bump-pins.sh`. All outdated pins change together, because the image contains them together.\n\n```\n%s\n```\n\nBefore you merge, follow the skill `bump-native-engine` for each component above: read the release notes, and check the test build and CI results below.\n' "$changes")"
          number="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body "$body"
          else
            gh pr create --head "$BRANCH" --base "$BASE" --title "$title" --body "$body"
          fi
          # Pushes by this workflow do not start other workflows. A dispatch does.
          gh workflow run ci.yml --ref "$BRANCH"

      - name: Free disk space
        if: steps.bump.outputs.changed == 'true'
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true
          docker-images: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true

      - name: Set up Buildx
        if: steps.bump.outputs.changed == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the registry
        if: steps.bump.outputs.changed == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test build of the image (no push)
        if: steps.bump.outputs.changed == 'true'
        env:
          OWNER: ${{ github.repository_owner }}
          # Read the cache of the last published build, never write it.
          REGISTRY_CACHE: 'true'
        run: |
          set -euo pipefail
          export OWNER="${OWNER,,}"
          docker buildx bake --print final
          docker buildx bake final

      - name: Report the result on the pull request
        if: always() && steps.bump.outputs.changed == 'true'
        env:
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh pr comment "$number" --body "Test build of the image: **$RESULT** ($RUN_URL). CI runs as the workflow CI on this branch."
          fi
