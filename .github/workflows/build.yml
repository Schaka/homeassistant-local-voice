name: Build image

# Publishes the self-contained Wyoming voice image to ghcr.io:
#   - push to main        -> :latest + :<date>
#   - push a tag v*       -> additionally a stable :vX.Y.Z
#   - manual dispatch     -> pick a release tag and/or override the model
#                            URLs (bigger STT / TTS, other voice, other lang)
#
# Everything build-related (tags, cache refs, model args) is decided in
# docker-bake.hcl -- this workflow only hands variables over, so `docker
# buildx bake final` locally reproduces CI exactly. The audiocpp stage
# compiles from source, so the ~360 min timeout and the registry cache
# (mode=max on the final stage) are what keep rebuilds cheap.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Stable tag to publish (e.g. "v1.0.0"). Empty = latest + dated only.'
        required: false
        default: ''
      stt_model_url:
        description: 'STT gguf URL override (default: Parakeet CTC 0.6B q8_0)'
        required: false
        default: ''
      tts_model_url:
        description: 'TTS gguf URL override (default: PocketTTS-100M English q8_0)'
        required: false
        default: ''
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The audiocpp stage builds from source; hosted runners ship ~14GB disk.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          docker-images: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          OWNER: ${{ github.repository_owner }}
          REGISTRY_CACHE: 'true'
          CACHE_TARGET: 'final'
          RELEASE_TAG_IN: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
          # workflow_dispatch inputs arrive as empty strings when unset; bake's
          # default variables win unless we export something non-empty.
          STT_MODEL_URL_IN: ${{ inputs.stt_model_url }}
          TTS_MODEL_URL_IN: ${{ inputs.tts_model_url }}
        run: |
          set -euo pipefail
          export OWNER="${OWNER,,}"      # ghcr package paths are lowercased
          export DATE
          DATE="$(date -u +%Y%m%d)"
          export SOURCE_DATE="$DATE"

          # Stable tag: manual input first, else an actual git tag v* push.
          # A branch push (ref_name="main") must NOT publish a :main tag.
          if [ -n "$RELEASE_TAG_IN" ]; then
            export RELEASE_TAG="$RELEASE_TAG_IN"
          elif [[ "$REF_NAME" == v* ]]; then
            export RELEASE_TAG="$REF_NAME"
          fi
          if [ -n "$STT_MODEL_URL_IN" ]; then export STT_MODEL_URL="$STT_MODEL_URL_IN"; fi
          if [ -n "$TTS_MODEL_URL_IN" ]; then export TTS_MODEL_URL="$TTS_MODEL_URL_IN"; fi

          # Printed first so a failed build has the fully resolved graph --
          # tags, args, cache refs -- right above it in the log.
          docker buildx bake --print final
          docker buildx bake --push final