name: CI

# Checks for every push and pull request. The image workflow calls this one
# first and builds only when it passes.

on:
  push:
    branches-ignore: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

env:
  CARGO_TERM_COLOR: always
  # PyO3 links against the same Python as the runtime image (Debian trixie).
  PYO3_PYTHON: python3.13

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - run: cargo fmt --all --check

  clippy-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      # Reads rust-toolchain.toml, denies warnings and caches ~/.cargo and target/.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Advisories (RustSec), licenses, banned and duplicate crates, sources.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check all

  # The llama.cpp bindings (src/media/*_sys.rs) must match the llama.cpp
  # build in the image (LLAMACPP_BUILD in docker-bake.hcl). After a bump
  # without scripts/gen-llama-bindings.sh, this job fails instead of the
  # embedder at runtime.
  bindings:
    runs-on: ubuntu-latest
    env:
      BINDGEN_VERSION: 0.73.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/bindgen
          key: bindgen-${{ env.BINDGEN_VERSION }}-${{ runner.os }}
      - run: sudo apt-get update -q && sudo apt-get install -y -q libclang-dev
      - run: command -v bindgen || cargo install bindgen-cli --version "$BINDGEN_VERSION" --locked
      - run: ./scripts/gen-llama-bindings.sh
      - run: git diff --exit-code src/media/llama_sys.rs src/media/ggml_sys.rs
