name: CI

# Checks for every push and pull request. The image workflow calls this one
# first and builds only when it passes.

on:
  push:
    branches-ignore: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_call:
  # The workflow "Bump pins" starts CI on its branches this way.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

env:
  CARGO_TERM_COLOR: always
  # PyO3 links against the same Python as the runtime image (Debian trixie).
  PYO3_PYTHON: python3.13

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
      - run: cargo fmt --all --check

  clippy-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      # The full path holds the patch version. PyO3 configures its build again
      # when PYO3_PYTHON changes, so the cached target/ never links against the
      # folder of an older Python.
      - run: echo "PYO3_PYTHON=$pythonLocation/bin/python3.13" >> "$GITHUB_ENV"
      # Reads rust-toolchain.toml, denies warnings and caches ~/.cargo and target/.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      # build.rs generates the llama.cpp bindings with bindgen (libclang) from
      # the headers of LLAMACPP_BUILD, as in the image.
      - run: sudo apt-get update -q && sudo apt-get install -y -q libclang-dev
      - run: ./scripts/fetch-llama-headers.sh
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release

  # The real llama-server of each engine in the image answers the way the
  # recordings in tests/fixtures/llm say. A 1 MB model keeps the job small.
  engine-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [llamacpp, ik]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      # The full path holds the patch version. PyO3 configures its build again
      # when PYO3_PYTHON changes, so the cached target/ never links against the
      # folder of an older Python.
      - run: echo "PYO3_PYTHON=$pythonLocation/bin/python3.13" >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - run: sudo apt-get update -q && sudo apt-get install -y -q libclang-dev libgomp1 cmake
      - run: ./scripts/fetch-llama-headers.sh
      # GitHub and Hugging Face answer 504 for short periods. The job keeps the
      # downloads of test-engine-contract.sh, so most runs send no request. A
      # cache saved on main reaches every branch and pull request. The test
      # model changes only with the script, the llama.cpp release with its pin.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/engine-contract/stories260K.gguf
          key: engine-contract-model-${{ hashFiles('scripts/test-engine-contract.sh') }}
      - if: matrix.engine == 'llamacpp'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/engine-contract/llama-*
          key: llamacpp-${{ hashFiles('docker-bake.hcl') }}
      # ik_llama.cpp builds from source in about five minutes. The cache key
      # holds the commit and the build script.
      - if: matrix.engine == 'ik'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/engine-contract/ik-*/build
          key: ik-${{ hashFiles('docker-bake.hcl', 'scripts/build-ik-llama.sh') }}
      - run: ./scripts/test-engine-contract.sh ${{ matrix.engine }}

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Advisories (RustSec), licenses, banned and duplicate crates, sources.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check all

