[package]
name = "assistant-hub"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "One server on one port for a local Home Assistant voice setup: Wyoming STT and TTS, an LLM proxy, MCP tools, web and YouTube search"
repository = "https://github.com/Schaka/homeassistant-local-voice"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "http1", "service"] }
libc = "0.2.191"
libloading = "0.9.0"
nix = { version = "0.31.3", features = ["signal", "process"] }
pyo3 = { version = "0.30.1", features = ["auto-initialize"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "gzip", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "chrono"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[build-dependencies]
bindgen = { version = "0.73.2", default-features = false, features = ["runtime", "prettyplease"] }
